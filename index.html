    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #ffffff;
        color: #18181b;
        background-image: none;
      }

      @keyframes ps-reveal-up {
        from {
          opacity: 0;
          transform: translate3d(0, 14px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      .ps-reveal-up {
        opacity: 0;
        animation: ps-reveal-up 700ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        will-change: transform, opacity;
      }

      @media (prefers-reduced-motion: reduce) {
        .ps-reveal-up {
          opacity: 1;
          animation: none;
          transform: none;
        }
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      .work-scroll { scrollbar-width: thin; scrollbar-color: #d4d4d8 transparent; }
      .work-scroll::-webkit-scrollbar { width: 8px; }
      .work-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 999px; border: 2px solid #fff; }
      @media (max-width: 1023px) {
        .portfolio-shell { height: auto; overflow: visible; }
        .work-scroll { height: auto; overflow: visible; }
      }
    </style>
